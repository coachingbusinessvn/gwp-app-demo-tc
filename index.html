<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Performance Follow-up | GoWise Partners</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/gwp.css">
</head>
<body class="login">
<form class="loginbox" id="frm-login" autocomplete="on">
  <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="52" height="52" role="img" aria-label="GoWise Partners"><circle cx="32" cy="32" r="29" fill="none" stroke="#C9A668" stroke-width="3"/><path d="M20 22l7 22 5-14 5 14 7-22" fill="none" stroke="#E7D0A2" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="brand">GoWise Partners</div>
  <h1>Performance Follow-up</h1>
  <p class="sub">Theo dõi canvas hiệu suất của đội ngũ theo nhịp tuần: ai đang đúng nhịp, ai cần bạn vào cuộc, và điều gì đang chặn kết quả.</p>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" autocomplete="username" required>

  <label for="pw">Mật khẩu</label>
  <input type="password" id="pw" name="password" autocomplete="current-password" required>

  <p class="err" id="loginErr" role="alert" hidden></p>

  <button class="btn" type="submit">Đăng nhập</button>
</form>

<script type="module" src="web/auth.js"></script>
</body>
</html>
