# Disposable PostgreSQL for integration tests only.
# NOT the production compose file (that lands in task 0.6).
# Start: npm run db:test:up   Stop+wipe: npm run db:test:down
services:
  test-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gwp_test
      POSTGRES_USER: gwp_test
      POSTGRES_PASSWORD: gwp_test
    # Headroom for parallel fixtures — each fixture holds small pools
    # (maintenance 2 + migrator 2 + runtime 5) but connection churn under
    # argon2 load once exhausted the default 100.
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gwp_test -d gwp_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
