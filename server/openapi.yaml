# GWP public API contract — Phase 0 surface (spec §2, §8).
# Hand-maintained; served verbatim (parsed to JSON) at GET /api/v1/openapi.json.
#
# Rules that must always hold for this file:
#   - NEVER put secrets, real credentials or example passwords here — the
#     deployment test asserts the document contains none.
#   - Every error response uses the shared envelope
#     {code, message, details?, request_id} (components/schemas/Error).
#   - Only document endpoints that actually exist.
openapi: 3.0.3
info:
  title: GWP API
  version: 0.1.0
  description: >
    GWP — Canvas Online as a self-hosted app. Phase 0 ships first-run
    setup, session auth and health probes; Phase 1 adds the organization
    surface (company profile, departments, teams — spec §3/§4). Canvas,
    coaching and AI endpoints arrive in later phases.
  contact:
    name: GWP operators
servers:
  - url: /
    description: Same origin as the served web app.
tags:
  - name: health
    description: Container/orchestration probes.
  - name: setup
    description: One-shot first-run bootstrap.
  - name: auth
    description: Session authentication (JWT access + rotating refresh).
  - name: org
    description: >
      Organization administration — single-company deployment, so there is
      NO company create/list endpoint: the company is a singleton profile.
      Mutations are owner/admin only; every authenticated member can read.

paths:
  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      description: >
        Always 200 when the process is up — never touches the database or any
        external service. Safe for container HEALTHCHECK.
      operationId: healthLive
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status, now]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  now:
                    type: string
                    format: date-time

  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: >
        200 only when the database is reachable AND all migrations are
        applied. Returns 503 (never 500) while the DB is down or migrations
        are pending — the app may serve degraded until the one-shot
        migrator finishes.
      operationId: healthReady
      responses:
        "200":
          description: Database reachable, migrations current.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          description: DB unreachable or migrations pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup:
    post:
      tags: [setup]
      summary: First-run owner bootstrap
      description: >
        Creates the company + owner account exactly once, guarded by the
        operator bootstrap token (BOOTSTRAP_TOKEN env). Permanently closes
        after the first success — later calls return 409. Never issues
        session tokens; log in afterwards.
      operationId: setupBootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Company and owner created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Bootstrap token missing or wrong (generic).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Setup already completed, or DEMO_MODE mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Password login
      description: >
        Verifies email + password, opens a session and returns a short-lived
        access JWT. The rotating refresh token is set ONLY as an HttpOnly
        `gwp_refresh` cookie (Secure, SameSite=Strict, Path=/api/v1/auth);
        the JS-readable `gwp_csrf` double-submit cookie is set alongside it.
        Rate-limited per account+IP and per IP.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          headers:
            Set-Cookie:
              description: gwp_refresh (HttpOnly) + gwp_csrf session cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials (generic — no user enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token
      description: >
        Requires the `gwp_refresh` cookie, an `Origin` header equal to the
        configured APP_ORIGIN, and `X-CSRF-Token` matching the `gwp_csrf`
        cookie. Rotation is atomic: a reused (already-consumed) refresh
        token revokes the whole session. No request body.
      operationId: authRefresh
      parameters:
        - $ref: "#/components/parameters/XCsrfToken"
      responses:
        "200":
          description: New access token; cookies rotated.
          headers:
            Set-Cookie:
              description: Rotated gwp_refresh + gwp_csrf cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          description: Missing/invalid/reused/expired refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Origin or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout — revoke the session
      description: >
        Same Origin + CSRF gates as refresh. Revokes the session behind the
        presented refresh token and clears both cookies; idempotent — 204
        even without a cookie.
      operationId: authLogout
      parameters:
        - $ref: "#/components/parameters/XCsrfToken"
      responses:
        "204":
          description: Session revoked (or none existed).
        "403":
          description: Origin or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current profile + roles
      description: >
        Bearer access JWT required. Profile and roles are re-read from the
        database on every call — no role claims are trusted from the token.
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile and role keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/company:
    get:
      tags: [org]
      summary: Current company profile
      description: >
        Returns the singleton company of this deployment. Any authenticated
        member may read it.
      operationId: getCompany
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The company profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [org]
      summary: Update the company profile
      description: >
        Owner/admin only. At least one of name/timezone is required;
        timezone must be a valid IANA identifier (e.g. Asia/Ho_Chi_Minh).
        Strict body — privilege fields like role/managerId are rejected.
      operationId: updateCompany
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyPatchRequest"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "400":
          description: Body failed validation (incl. invalid IANA timezone).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/departments:
    get:
      tags: [org]
      summary: List departments (keyset page)
      description: >
        Company-scoped list, ordered by id, including archived units (each
        carries archivedAt). limit defaults to 25, max 100; cursor is the
        id of the last item of the previous page.
      operationId: listDepartments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: One page of departments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentPage"
        "400":
          description: Invalid limit or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [org]
      summary: Create a department
      description: Owner/admin only. Strict body — only name is accepted.
      operationId: createDepartment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentCreateRequest"
      responses:
        "201":
          description: Department created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/departments/{id}:
    patch:
      tags: [org]
      summary: Rename a department
      description: >
        Owner/admin only; works on live and archived units. Unknown or
        non-uuid ids return the consistent 404.
      operationId: updateDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgUnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdateRequest"
      responses:
        "200":
          description: Department updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such department in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/departments/{id}/archive:
    post:
      tags: [org]
      summary: Archive a department
      description: >
        Owner/admin only. A department still referenced by any user returns
        409 ORG_UNIT_IN_USE — members must be transferred first; there is no
        cascade delete. Archiving is idempotent; archived units keep their
        row and historical foreign keys.
      operationId: archiveDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgUnitId"
      responses:
        "200":
          description: Department archived (or already archived).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such department in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Department is still referenced by users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/teams:
    get:
      tags: [org]
      summary: List teams (keyset page)
      description: >
        Company-scoped list, ordered by id, including archived units;
        optionally filtered by departmentId.
      operationId: listTeams
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/DepartmentIdFilter"
      responses:
        "200":
          description: One page of teams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPage"
        "400":
          description: Invalid limit, cursor or departmentId filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [org]
      summary: Create a team
      description: >
        Owner/admin only. departmentId must be a live (non-archived)
        department of this company — the composite foreign key also makes
        cross-company targets impossible.
      operationId: createTeam
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreateRequest"
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such department in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Target department is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/teams/{id}:
    patch:
      tags: [org]
      summary: Rename or move a team
      description: >
        Owner/admin only. A departmentId patch moves the team; the target
        must be a live department of this company.
      operationId: updateTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgUnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdateRequest"
      responses:
        "200":
          description: Team updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such team, or target department, in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Target department is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/teams/{id}/archive:
    post:
      tags: [org]
      summary: Archive a team
      description: >
        Owner/admin only. A team still referenced by any user returns 409
        ORG_UNIT_IN_USE — members must be transferred first; there is no
        cascade delete. Archiving is idempotent; archived units keep their
        row and historical foreign keys.
      operationId: archiveTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgUnitId"
      responses:
        "200":
          description: Team archived (or already archived).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such team in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Team is still referenced by users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the `gwp_csrf` cookie (double-submit).
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      description: Page size — default 25, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Keyset cursor — the id of the last item of the previous page.
      schema:
        type: string
        format: uuid
    OrgUnitId:
      name: id
      in: path
      required: true
      description: Org unit id inside the caller's company.
      schema:
        type: string
        format: uuid
    DepartmentIdFilter:
      name: departmentId
      in: query
      required: false
      description: Restrict the team list to one department.
      schema:
        type: string
        format: uuid
  responses:
    RateLimited:
      description: Rate limit exceeded — see Retry-After header.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable machine code (e.g. INVALID_SESSION).
        message:
          type: string
          description: Human-readable, Vietnamese UI copy.
        details:
          description: Optional structured detail (field names, pending list).
        request_id:
          type: string
          format: uuid
          description: Echo of the X-Request-Id response header.
    PublicUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        title:
          type: string
          nullable: true
    SetupRequest:
      type: object
      required: [companyName, email, password, bootstrapToken]
      properties:
        companyName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          description: Owner password — 12+ chars, Argon2id-hashed at rest.
        bootstrapToken:
          type: string
          description: Operator-provided BOOTSTRAP_TOKEN value.
    SetupResponse:
      type: object
      required: [userId, companyId]
      properties:
        userId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: HS256 JWT — iss=gwp, aud=gwp-web, ~10 min TTL.
        user:
          $ref: "#/components/schemas/PublicUser"
    RefreshResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
    MeResponse:
      type: object
      required: [user, roles]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        roles:
          type: array
          items:
            type: string
            enum: [owner, admin, manager, member]
    CompanyProfile:
      type: object
      required: [id, name, timezone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          description: IANA timezone identifier (e.g. Asia/Ho_Chi_Minh).
        createdAt:
          type: string
          format: date-time
    CompanyPatchRequest:
      type: object
      description: >
        At least one field required. Strict — unknown keys are rejected.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          description: Valid IANA timezone identifier.
          maxLength: 100
    Department:
      type: object
      required: [id, name, archivedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Non-null when the unit is archived; never deleted.
    DepartmentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Department"
        nextCursor:
          type: string
          nullable: true
          description: Pass as ?cursor= for the next page; null at the end.
    DepartmentCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    DepartmentUpdateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    Team:
      type: object
      required: [id, departmentId, name, archivedAt]
      properties:
        id:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        name:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
    TeamPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        nextCursor:
          type: string
          nullable: true
    TeamCreateRequest:
      type: object
      required: [departmentId, name]
      additionalProperties: false
      properties:
        departmentId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
    TeamUpdateRequest:
      type: object
      description: >
        At least one field required. Strict — unknown keys are rejected.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        departmentId:
          type: string
          format: uuid
