# GWP public API contract — Phase 0 surface (spec §2, §8).
# Hand-maintained; served verbatim (parsed to JSON) at GET /api/v1/openapi.json.
#
# Rules that must always hold for this file:
#   - NEVER put secrets, real credentials or example passwords here — the
#     deployment test asserts the document contains none.
#   - Every error response uses the shared envelope
#     {code, message, details?, request_id} (components/schemas/Error).
#   - Only document endpoints that actually exist.
openapi: 3.0.3
info:
  title: GWP API
  version: 0.1.0
  description: >
    GWP — Canvas Online as a self-hosted app. Phase 0 ships first-run
    setup, session auth and health probes; Phase 1 adds the organization
    surface (company profile, departments, teams — spec §3/§4). Canvas,
    coaching and AI endpoints arrive in later phases.
  contact:
    name: GWP operators
servers:
  - url: /
    description: Same origin as the served web app.
tags:
  - name: health
    description: Container/orchestration probes.
  - name: setup
    description: One-shot first-run bootstrap.
  - name: auth
    description: Session authentication (JWT access + rotating refresh).
  - name: org
    description: >
      Organization administration — single-company deployment, so there is
      NO company create/list endpoint: the company is a singleton profile.
      Mutations are owner/admin only; every authenticated member can read.
  - name: users
    description: >
      User administration and directory — the reporting line and role set
      are owner-only; profile edits are self or owner/admin; lifecycle
      (pending → active → inactive) follows spec §8.
  - name: settings
    description: >
      Company settings — branding personalizes the shell for every member;
      writes are owner/admin only and the strict schema admits no HTML,
      URL or free CSS.
  - name: audit
    description: >
      Administrative audit trail — owner/admin only, metadata-only rows;
      there is no endpoint to read raw rows or content payloads.
  - name: canvas
    description: >
      Performance Architecture Canvases — subject content behind the shared
      subject policy: self, the owner (whole company) or a manager over the
      canvas owner's current reporting subtree. Admin has no canvas
      privilege beyond its own canvases. Published versions are immutable
      snapshots — there is no version update or delete endpoint.

paths:
  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      description: >
        Always 200 when the process is up — never touches the database or any
        external service. Safe for container HEALTHCHECK.
      operationId: healthLive
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status, now]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  now:
                    type: string
                    format: date-time

  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: >
        200 only when the database is reachable AND all migrations are
        applied. Returns 503 (never 500) while the DB is down or migrations
        are pending — the app may serve degraded until the one-shot
        migrator finishes.
      operationId: healthReady
      responses:
        "200":
          description: Database reachable, migrations current.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          description: DB unreachable or migrations pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup:
    post:
      tags: [setup]
      summary: First-run owner bootstrap
      description: >
        Creates the company + owner account exactly once, guarded by the
        operator bootstrap token (BOOTSTRAP_TOKEN env). Permanently closes
        after the first success — later calls return 409. Never issues
        session tokens; log in afterwards.
      operationId: setupBootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Company and owner created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Bootstrap token missing or wrong (generic).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Setup already completed, or DEMO_MODE mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Password login
      description: >
        Verifies email + password, opens a session and returns a short-lived
        access JWT. The rotating refresh token is set ONLY as an HttpOnly
        `gwp_refresh` cookie (Secure, SameSite=Strict, Path=/api/v1/auth);
        the JS-readable `gwp_csrf` double-submit cookie is set alongside it.
        Rate-limited per account+IP and per IP.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          headers:
            Set-Cookie:
              description: gwp_refresh (HttpOnly) + gwp_csrf session cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials (generic — no user enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token
      description: >
        Requires the `gwp_refresh` cookie, an `Origin` header equal to the
        configured APP_ORIGIN, and `X-CSRF-Token` matching the `gwp_csrf`
        cookie. Rotation is atomic: a reused (already-consumed) refresh
        token revokes the whole session. No request body.
      operationId: authRefresh
      parameters:
        - $ref: "#/components/parameters/XCsrfToken"
      responses:
        "200":
          description: New access token; cookies rotated.
          headers:
            Set-Cookie:
              description: Rotated gwp_refresh + gwp_csrf cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          description: Missing/invalid/reused/expired refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Origin or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout — revoke the session
      description: >
        Same Origin + CSRF gates as refresh. Revokes the session behind the
        presented refresh token and clears both cookies; idempotent — 204
        even without a cookie.
      operationId: authLogout
      parameters:
        - $ref: "#/components/parameters/XCsrfToken"
      responses:
        "204":
          description: Session revoked (or none existed).
        "403":
          description: Origin or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current profile + roles
      description: >
        Bearer access JWT required. Profile and roles are re-read from the
        database on every call — no role claims are trusted from the token.
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile and role keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/activate:
    post:
      tags: [auth]
      summary: Consume an activation token
      description: >
        Public one-time-token consume (pending → active). The token itself
        is the credential — the owner hands it over an internal channel and
        it is shown exactly once at issuance. Sets the account's first
        password, flips status to active and revokes any sessions the
        account may hold. Identical 400 INVALID_TOKEN for unknown,
        expired, already-used or wrong-purpose tokens — the response never
        reveals which check failed. Does NOT log the user in: no cookies,
        no tokens — the client logs in afterwards.
      operationId: authActivate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialConsumeRequest"
      responses:
        "204":
          description: Token consumed; account activated.
        "400":
          description: >
            INVALID_TOKEN (unknown/expired/used/wrong purpose) or
            INVALID_INPUT (malformed body, weak password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/reset:
    post:
      tags: [auth]
      summary: Consume a password-reset token
      description: >
        Same contract as /auth/activate for purpose=reset tokens issued on
        ACTIVE accounts. Sets the new password and revokes every live
        session of the account — durable kill, not just a status check.
        Does NOT log the user in.
      operationId: authReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialConsumeRequest"
      responses:
        "204":
          description: Token consumed; password replaced.
        "400":
          description: >
            INVALID_TOKEN (unknown/expired/used/wrong purpose) or
            INVALID_INPUT (malformed body, weak password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: Change the caller's own password
      description: >
        Bearer-auth self-service change. Verifies the current password
        (one generic INVALID_CREDENTIALS on any mismatch — no detail
        leak), requires the new password to be 12+ chars, then revokes
        EVERY session of the caller including the one carrying this
        request — re-login is mandatory (spec §8).
      operationId: authChangePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Password changed; all sessions revoked.
        "400":
          description: >
            INVALID_CREDENTIALS (wrong current password) or INVALID_INPUT
            (malformed body, weak new password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/company:
    get:
      tags: [org]
      summary: Current company profile
      description: >
        Returns the singleton company of this deployment. Any authenticated
        member may read it.
      operationId: getCompany
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The company profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [org]
      summary: Update the company profile
      description: >
        Owner/admin only. At least one of name/timezone is required;
        timezone must be a valid IANA identifier (e.g. Asia/Ho_Chi_Minh).
        Strict body — privilege fields like role/managerId are rejected.
      operationId: updateCompany
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyPatchRequest"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "400":
          description: Body failed validation (incl. invalid IANA timezone).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/departments:
    get:
      tags: [org]
      summary: List departments (keyset page)
      description: >
        Company-scoped list, ordered by id, including archived units (each
        carries archivedAt). limit defaults to 25, max 100; cursor is the
        id of the last item of the previous page.
      operationId: listDepartments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: One page of departments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentPage"
        "400":
          description: Invalid limit or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [org]
      summary: Create a department
      description: Owner/admin only. Strict body — only name is accepted.
      operationId: createDepartment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentCreateRequest"
      responses:
        "201":
          description: Department created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/departments/{id}:
    patch:
      tags: [org]
      summary: Rename a department
      description: >
        Owner/admin only; works on live and archived units. Unknown or
        non-uuid ids return the consistent 404.
      operationId: updateDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgUnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdateRequest"
      responses:
        "200":
          description: Department updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such department in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/departments/{id}/archive:
    post:
      tags: [org]
      summary: Archive a department
      description: >
        Owner/admin only. A department still referenced by any user, or
        still holding live (non-archived) teams, returns 409
        ORG_UNIT_IN_USE — transfer members and archive/move child teams
        first; there is no cascade delete. Archiving is idempotent;
        archived units keep their row and historical foreign keys.
      operationId: archiveDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgUnitId"
      responses:
        "200":
          description: Department archived (or already archived).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such department in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Department is still referenced by users or has live teams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/teams:
    get:
      tags: [org]
      summary: List teams (keyset page)
      description: >
        Company-scoped list, ordered by id, including archived units;
        optionally filtered by departmentId.
      operationId: listTeams
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/DepartmentIdFilter"
      responses:
        "200":
          description: One page of teams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPage"
        "400":
          description: Invalid limit, cursor or departmentId filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [org]
      summary: Create a team
      description: >
        Owner/admin only. departmentId must be a live (non-archived)
        department of this company — the composite foreign key also makes
        cross-company targets impossible.
      operationId: createTeam
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreateRequest"
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such department in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Target department is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/teams/{id}:
    patch:
      tags: [org]
      summary: Rename or move a team
      description: >
        Owner/admin only. A departmentId patch moves the team; the target
        must be a live department of this company, and a team that still
        has members cannot move — transfer them first (409
        ORG_UNIT_IN_USE). Moving an empty team is allowed.
      operationId: updateTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgUnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdateRequest"
      responses:
        "200":
          description: Team updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such team, or target department, in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Target department is archived, or the team still has members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/teams/{id}/archive:
    post:
      tags: [org]
      summary: Archive a team
      description: >
        Owner/admin only. A team still referenced by any user returns 409
        ORG_UNIT_IN_USE — members must be transferred first; there is no
        cascade delete. Archiving is idempotent; archived units keep their
        row and historical foreign keys.
      operationId: archiveTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgUnitId"
      responses:
        "200":
          description: Team archived (or already archived).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such team in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Team is still referenced by users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/{id}/manager:
    put:
      tags: [users]
      summary: Set a user's reporting line
      description: >
        Owner only — the reporting tree is a privilege boundary, so admin
        cannot graft itself into it (403). Sets or clears (`managerId:
        null`) the user's manager. Both users must be active members of
        the company; self-assignments and reporting cycles (the new
        manager must not sit in the user's current subtree) are rejected.
        Concurrent edits serialize on the company lock — the loser sees a
        clean 409, never a 500. Access changes apply on the very next
        authorization read; nothing is cached.
      operationId: setUserManager
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagerUpdateRequest"
      responses:
        "200":
          description: Reporting line updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserManager"
        "400":
          description: >
            Body failed validation — missing/non-uuid managerId, a
            self-assignment, or an unexpected key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user (subject or manager) in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The assignment would close a reporting cycle, or the subject
            or the new manager is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users:
    get:
      tags: [users]
      summary: List users (company directory, keyset page)
      description: >
        Company-scoped directory read, ordered by id, including pending and
        inactive accounts. Any authenticated member may read — the payload
        carries directory-safe fields only (never credential material).
        limit defaults to 25, max 100; cursor is the id of the last item of
        the previous page.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          description: Invalid limit or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [users]
      summary: Create a pending member
      description: >
        Owner/admin only. Always creates a PENDING account with the member
        role and no password — activation happens via the one-time token
        flow, and elevated roles are assigned later by the owner through
        PUT /users/{id}/roles. Email must be unique per company after
        normalization (lower + trim). departmentId/teamId optionally place
        the user; teamId pins the department to the team's own, and
        archived units are rejected. Strict body — privilege, credential,
        manager and status keys are rejected.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Pending member created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >
            Body failed validation — bad email, an unexpected key, or a
            departmentId/teamId pair that contradicts the team's
            department.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such department or team in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Email already in use in this company, or the target org unit
            is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/{id}:
    get:
      tags: [users]
      summary: Read one directory entry
      description: >
        Any authenticated member may read a colleague's directory metadata.
        Unknown, foreign or malformed ids return the consistent 404.
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user's directory entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [users]
      summary: Update non-privileged profile fields
      description: >
        Self-edit covers name/title only — org placement is org config
        (spec §4), so a patch carrying departmentId/teamId requires
        owner/admin even on the caller's own row. For edits of another
        account the actor must be owner/admin, with one asymmetry: a
        non-owner admin may never edit an owner/admin profile (403) — its
        own org fields included. Only name, title, departmentId and
        teamId are writable here; explicit null clears title/department/
        team. Role, manager, email, status and credential keys are rejected
        (strict body → 400). Org targets must be live units of this
        company — an archived department/team returns 409
        ORG_UNIT_ARCHIVED.
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >
            Body failed validation — empty patch, an unexpected
            (privilege/identity) key, or a departmentId/teamId pair that
            contradicts the team's department.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Caller may not edit this user — not self and not owner/admin,
            an org-placement field on a self-edit without owner/admin, or
            an admin touching an owner/admin profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user/department/team in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Target department or team is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/{id}/roles:
    put:
      tags: [users]
      summary: Replace a user's role set
      description: >
        Owner only — roles are a privilege boundary, so admin gets 403 even
        on itself. `roles` is the FULL replacement set over the allowlist
        {owner, admin, manager, member}; unknown keys fail validation.
        Removing the owner role from the last ACTIVE owner returns 409
        LAST_OWNER; concurrent attempts serialize on the company lock so
        exactly one wins. The new set takes effect on the very next
        authorization read — roles are never cached in the JWT.
      operationId: setUserRoles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolesUpdateRequest"
      responses:
        "200":
          description: Role set replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >
            Body failed validation — missing roles, an unknown role key,
            or an unexpected field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The change would remove the last active owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/{id}/deactivate:
    post:
      tags: [users]
      summary: Deactivate a user (soft, sessions revoked)
      description: >
        Owner/admin only, with the spec §4 asymmetry: admin may deactivate
        plain members only — never an owner/admin account (re-deactivating
        an already-inactive one is still 403, not a no-op) and never a
        user who still has direct reports of any status (moving a
        reporting line is owner territory). The owner may deactivate
        anyone except the last ACTIVE owner (409 LAST_OWNER). When the
        target has ANY direct reports — active or dormant — the owner must
        decide their line in the SAME transaction: omit
        replacementManagerId → 403 REPORTS_UNASSIGNED; explicit null →
        reports become unassigned; a uuid → reports transfer to that
        active, same-company user outside the target's subtree (409
        REPORTING_CYCLE otherwise). Every live session of the target is
        revoked durably right after commit — the account's old tokens 401
        on the next request. Deactivating an already-inactive user is an
        idempotent no-op; the row and all historical FKs are kept.
      operationId: deactivateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDeactivateRequest"
      responses:
        "200":
          description: User deactivated (or already inactive).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >
            Body failed validation, or the replacement is the target
            itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Caller lacks the required privilege for this target — not
            owner/admin, an admin touching a privileged account or a user
            with direct reports of any status, or an owner who omitted the
            reports decision (REPORTS_UNASSIGNED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user (target or replacement) in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Target is the last active owner, the replacement is inactive,
            or the transfer would close a reporting cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/{id}/reactivate:
    post:
      tags: [users]
      summary: Reactivate an inactive user
      description: >
        Inverse of deactivate, with the same spec §4 asymmetry: owner/admin
        only, and admin may reactivate plain members only — never an
        owner/admin account (403). Only an INACTIVE account can be
        reactivated; an active or pending target is 409 USER_NOT_INACTIVE.
        The resulting status is decided by the server: an account that
        already holds a password returns to "active" with that credential
        (its old sessions were revoked durably at deactivation and stay
        revoked — a fresh login is required; the owner may issue a reset
        code afterwards if the credential is no longer trusted); an account
        that never set a password returns to "pending" and needs an
        owner-issued activation code. Roles, reporting line and org
        placement are kept. Audited as user.reactivate.
      operationId: reactivateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserReactivateRequest"
      responses:
        "200":
          description: User reactivated (status active or pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Body carried unexpected keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Caller is not owner/admin, or an admin targeted an owner/admin
            account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Target is not inactive (USER_NOT_INACTIVE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/{id}/credential-token:
    post:
      tags: [users]
      summary: Issue a one-time activation/reset token
      description: >
        OWNER only — admin gets 403 even for a member target, and an
        owner cannot issue for itself (403; self-service is POST
        /auth/password). `purpose` binds the token: "activate" is issuable
        only for pending users, "reset" only for active ones — the wrong
        pairing is 409. The raw 256-bit token is returned ONCE in this
        response; the database stores only its SHA-256 hash, so it can
        never be read back. Issuing again supersedes the previous unused
        token of the same user+purpose. Tokens expire after 24 hours and
        are consumed via POST /auth/activate or /auth/reset.
      operationId: issueCredentialToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialTokenIssueRequest"
      responses:
        "201":
          description: Token issued — shown to the issuer exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialTokenIssueResponse"
        "400":
          description: Body failed validation — missing/unknown purpose.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Caller is not an owner, or the owner tried to issue a token
            for itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Purpose/status mismatch — activate needs a pending target
            (USER_NOT_PENDING), reset needs an active one
            (USER_NOT_ACTIVE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/settings/branding:
    get:
      tags: [settings]
      summary: Read the company branding
      description: >
        Any authenticated member may read — the branding document
        personalizes the account shell for everyone. Returns the stored
        document or the shipped defaults when unset.
      operationId: getBranding
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current branding (or defaults).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [settings]
      summary: Replace the company branding
      description: >
        Owner/admin only. Full replace of the strict branding document —
        displayName is plain text (1-120 chars, rendered via textContent
        only) and accentColor must be a #rrggbb value. There is no field
        that could carry HTML, a URL or free CSS; stored values are
        audited by key name only, never by value (spec §9).
      operationId: updateBranding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Branding"
      responses:
        "200":
          description: Branding saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
        "400":
          description: >
            Body failed validation — empty/overlong displayName, a
            non-#rrggbb accentColor, or an unexpected key (strict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/settings/retention:
    get:
      tags: [settings]
      summary: Read the retention floors in force
      description: >
        Owner/admin only. Returns the configured retention document or
        the shipped spec minimums (audit 365d, AI metadata 90d, logs 30d,
        receipts 7d) when unset.
      operationId: getRetention
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current retention floors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retention"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [settings]
      summary: Replace the retention floors
      description: >
        Owner ONLY (spec §9 — retention is the owner's call, not an
        operational toggle). Full replace; every field is bounded below
        by the spec minimum, so a decrease is a plain 400. The retention
        job applies max(default, configured) — this document can only
        ever raise a floor.
      operationId: updateRetention
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Retention"
      responses:
        "200":
          description: Retention floors saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retention"
        "400":
          description: A floor below its spec minimum, or an unexpected key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/settings/ai:
    get:
      tags: [settings]
      summary: Read the AI (BYOK) settings — public shape only
      description: >
        Owner/admin only (spec §4 — unlike branding this read is
        privileged). Returns safe metadata only: whether a key is
        configured, the allowlisted endpoint, model and bounds. The API
        key and its encrypted envelope are NEVER returned.
      operationId: getAiSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current AI settings (or unconfigured defaults).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [settings]
      summary: Configure the local AI endpoint and BYOK key
      description: >
        Owner/admin only. `baseUrl` must resolve to a host:port pair in
        the operator's AI_ALLOWED_HOSTS deployment allowlist — admins
        cannot aim the AI client at arbitrary hosts. `apiKey` is stored
        AES-256-GCM encrypted under APP_KEY and never returned; omitting
        it preserves the stored key (explicit clear is DELETE
        /settings/ai/key). Rate-limited per client IP.
      operationId: putAiSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSettingsPut"
      responses:
        "200":
          description: Settings saved — public shape only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        "400":
          description: >
            Body failed validation (strict schema), or baseUrl is not an
            allowlisted destination / carries userinfo / uses http without
            the operator AI_ALLOW_HTTP opt-in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many settings writes — retry after the bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/settings/ai/key:
    delete:
      tags: [settings]
      summary: Explicitly clear the stored AI key
      description: >
        Owner/admin only. Removes the stored credential while keeping the
        endpoint/model/enabled configuration — the separate command makes
        key removal a deliberate act, never a side effect of an omitted
        PUT field.
      operationId: clearAiKey
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Key cleared — public shape with configured=false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many settings writes — retry after the bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/settings/ai/test:
    post:
      tags: [settings]
      summary: Probe the configured local AI endpoint
      description: >
        Owner/admin only. Sends a fixed synthetic prompt ("Reply with the
        word OK.", 16 output tokens) — never customer data — and reports
        whether the upstream answered, whether it streams SSE, and the
        latency. Failures surface as stable AI_* error codes
        (AI_NOT_CONFIGURED, AI_AUTH_FAILED, AI_BUSY, AI_UNAVAILABLE,
        AI_TIMEOUT, AI_BAD_RESPONSE, AI_REDIRECT_DENIED); upstream error
        bodies are never echoed. Rate-limited per client IP.
      operationId: testAiConnection
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The endpoint answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResult"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many probes — retry after the bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "499":
          description: Client cancelled the probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: >
            Endpoint reachable but failed: AI_AUTH_FAILED (bad key),
            AI_BAD_RESPONSE (malformed/unsupported answer),
            AI_REDIRECT_DENIED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: AI_NOT_CONFIGURED / AI_BUSY / AI_UNAVAILABLE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: AI_TIMEOUT — upstream exceeded the configured bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ai/status:
    get:
      tags: [ai]
      summary: Is local AI usable? (any signed-in user)
      description: >
        Lets every AI surface say "not configured" / "disabled" BEFORE the
        user consents to a run (spec §7.1). Returns exactly two booleans —
        no endpoint, model, key version or key material; the full settings
        document stays owner/admin only (GET /settings/ai). `enabled` is
        true only when a key is configured AND the configuration is on.
      operationId: getAiStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Availability flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ai/runs:
    post:
      tags: [ai]
      summary: Start a consented AI run on a canvas or coaching session
      description: >
        Canvas assistants (renderer, coach) require `canvasId` and write
        access to the target canvas (spec §4 "Chạy AI trên canvas — theo
        quyền sửa"; foreign/denied canvases answer the uniform 404,
        archived 409). The `oracle` assistant instead requires
        `sessionId` + `transcript` and current report-write authority on
        the coaching session — owner, or the session coach who still
        manages the coachee (spec §6). Requires
        `consent: true` — the caller has seen the internal-AI notice and
        the server re-enforces it. `idempotencyKey` is REQUIRED: a
        retried POST with the same key and same input replays the same
        run (200, replayed:true) instead of launching a second upstream
        call; the same key with different input is 409
        AI_IDEMPOTENCY_CONFLICT. At most 2 active (queued|running) runs
        per company — a third is 429 AI_BUSY. The run row stores metadata
        only (status, input hash, provenance, captured canvas base);
        `notes`, `transcript`, and canvas content are never persisted —
        the transcript exists only inside the request/run and is destroyed
        when inference ends. Progress is streamed on
        GET /ai/runs/{runId}/events; the finished proposal is staged into
        a 15-minute in-memory preview, never auto-applied — an ORACLE
        preview becomes a report only through POST /reports.
      operationId: startAiRun
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiRunStart"
      responses:
        "201":
          description: Run admitted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRunStartResult"
        "200":
          description: Idempotent replay — same key, same input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRunStartResult"
        "400":
          description: INVALID_INPUT (bad fields, missing key) or
            AI_CONSENT_REQUIRED (consent absent/false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Related actor who lost report-write authority on
            the session (oracle only — unrelated actors get 404).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Canvas or session missing, foreign, or not
            writable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: AI_IDEMPOTENCY_CONFLICT, AI_DISABLED, or
            CANVAS_ARCHIVED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: AI_BUSY — the per-company active-run cap (2) is
            reached; retry after a run finishes. Also the per-IP rate
            bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: AI_NOT_CONFIGURED — no endpoint/key saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ai/runs/{runId}:
    get:
      tags: [ai]
      summary: Read run status (creator only)
      description: >
        Returns the run's metadata DTO — status, timestamps, error code,
        usage counters when the endpoint reported them. Only the actor
        who created the run may read it; everyone else gets the uniform
        404 (existence is not revealed).
      operationId: getAiRun
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRun"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Run missing or owned by another actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ai/runs/{runId}/events:
    get:
      tags: [ai]
      summary: Stream run progress (SSE, creator only)
      description: >
        `text/event-stream` of {type:"status"|"delta"|"done"|"error"}
        events. The current status is sent first so a late subscriber
        sees where the run is; the stream ends after a terminal event.
        A client disconnect CANCELS a still-active run (spec §7.3 —
        upstream work stops when the caller is gone); terminal runs are
        unaffected.
      operationId: streamAiRunEvents
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: SSE stream; each `data:` frame is a JSON
            AiRunEvent.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Run missing or owned by another actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ai/runs/{runId}/preview:
    get:
      tags: [ai]
      summary: Read the staged AI proposal (creator only, 15-min TTL)
      description: >
        The validated proposal held in process memory for 15 minutes
        after the run succeeds — never persisted, never in a log. The
        response carries the `base` (published version + draft revision)
        captured at admission so apply can refuse a moved target. 410
        PREVIEW_EXPIRED covers expired, missing, and never-finished
        alike — the caller must run again.
      operationId: getAiRunPreview
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The staged proposal plus its captured base.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRunPreview"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Run missing or owned by another actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: PREVIEW_EXPIRED — expired or absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ai/runs/{runId}/cancel:
    post:
      tags: [ai]
      summary: Cancel a queued/running run (creator only)
      description: >
        Queued runs become cancelled immediately; a running run's abort
        signal propagates to the upstream call, which stops when the
        endpoint honors it. Terminal runs answer 409 AI_RUN_FINISHED —
        cancellation is not retroactive.
      operationId: cancelAiRun
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRun"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Run missing or owned by another actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: AI_RUN_FINISHED — run already terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ai/runs/{runId}/apply:
    post:
      tags: [ai]
      summary: Apply the staged proposal to the draft (creator only, one-shot)
      description: >
        Applies the SERVER-HELD preview — the request carries no canvas
        body, so generated content can never be injected or forged. The
        preview must have no error-severity issues (409
        AI_PROPOSAL_INVALID), every warning must be listed in
        `acceptedWarnings` by issue id (400 AI_WARNINGS_UNACCEPTED), and
        the captured base must still match: a draft that moved since the
        run is 409 AI_BASE_CHANGED, a new published version is 409
        VERSION_CONFLICT. Apply consumes the preview — a second call is
        410 PREVIEW_EXPIRED. The draft is stamped source="ai" with the
        run id; publish remains a separate human step.
      operationId: applyAiRun
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiRunApplyRequest"
      responses:
        "200":
          description: Proposal applied to the draft (draft DTO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasDraft"
        "400":
          description: >
            INVALID_INPUT (malformed body — including any client-sent
            canvas body) or AI_WARNINGS_UNACCEPTED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Run missing, owned by another actor, or canvas access lost.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            AI_RUN_NOT_READY (run not succeeded), AI_PROPOSAL_INVALID
            (error-severity issues), AI_BASE_CHANGED (draft moved), or
            VERSION_CONFLICT (published base changed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: PREVIEW_EXPIRED — expired, consumed, or absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/audit:
    get:
      tags: [audit]
      summary: List audit events (metadata-only, keyset page)
      description: >
        Owner/admin only (spec §4). Returns operational metadata rows —
        id, at, actorId, action, outcome, requestId, targetType/targetId
        and the safe_metadata allowlist re-applied on read; a key that is
        not allowlisted is dropped, so no content or secret can ever
        leave this endpoint. Ordered newest-first over (created_at, id);
        limit defaults to 25, max 100; cursor is the opaque token from
        nextCursor.
      operationId: listAuditEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from the previous page's nextCursor.
          schema:
            type: string
      responses:
        "200":
          description: One page of metadata-only audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          description: Invalid limit or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/canvases:
    post:
      tags: [canvas]
      summary: Create a canvas and its first draft
      description: >
        Subject policy on ownerUserId: a member may create only for itself,
        a manager for users in its current reporting subtree, the owner for
        anyone — admin for itself only (canvas content is subject data, not
        org metadata). ownerUserId must be an ACTIVE user of the company.
        `name` is the canvas record's display name and is stamped into
        body.meta.title. `body` is the canonical canvas document
        (docs/contracts/canvas-payload.md), validated draft-mode: schema or
        referential errors are 400 with issue paths, blanks are fine.
        assignee_user_id fields inside the body must resolve to
        same-company users or the write is rejected — they are content,
        never an access grant. Creates the canvas and the shared draft
        (revision 1) atomically and audits canvas.create +
        canvas.draft.create (metadata only).
      operationId: createCanvas
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasCreateRequest"
      responses:
        "201":
          description: Canvas and first draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasCreateResponse"
        "400":
          description: >
            Body failed validation — strict envelope, a schema-invalid
            canvas body (issue paths in details.fields), or an
            assignee_user_id that is not a user of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No subject access to ownerUserId, or no such user in this
            company — the denial is uniform.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The target owner is not an active user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [canvas]
      summary: List visible canvases (keyset page)
      description: >
        The canvases whose owner sits in the caller's subject scope —
        self for members, the whole company for the owner, the current
        reporting subtree for managers, own canvases only for admin.
        Ordered newest-first over (created_at, id); limit defaults to 25,
        max 100; cursor is the opaque token from nextCursor. An empty
        scope is a valid empty page.
      operationId: listCanvases
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from the previous page's nextCursor.
          schema:
            type: string
      responses:
        "200":
          description: One page of visible canvases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasPage"
        "400":
          description: Invalid limit or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/canvases/{id}:
    get:
      tags: [canvas]
      summary: Read one canvas (detail + draft + current version summary)
      description: >
        Subject policy on the canvas owner — self/owner/subtree only;
        admin sees only its own canvases. Missing, foreign and denied ids
        all return the same 404. The draft carries its working body; the
        current published version is summarized (its body comes from the
        versions endpoint).
      operationId: getCanvas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
      responses:
        "200":
          description: The canvas detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Canvas"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such canvas, or no subject access to its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [canvas]
      summary: Rename the canvas record
      description: >
        Changes the record's display name only (lists, detail, dashboard).
        Same write gate as every canvas mutation — subject access on the
        canvas owner (self, owner role, manager over the current subtree);
        admin only for its own canvases. Missing, foreign and denied ids
        are the uniform 404, and that check precedes body validation. The
        shared draft (whose meta.title is user-edited content) is NOT
        touched and its revision does not move. Audited as `canvas.rename`
        with the field name only — never the new name.
      operationId: renameCanvas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasRenameRequest"
      responses:
        "200":
          description: The canvas detail with the new name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Canvas"
        "400":
          description: Empty/over-long name or an unknown field (strict body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such canvas, or no subject access to its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: CANVAS_ARCHIVED — archived canvases are read-only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/canvases/{id}/draft:
    post:
      tags: [canvas]
      summary: Open the canvas's shared draft
      description: >
        Creates the single shared draft for this canvas — one draft per
        canvas, ever present at most once. The draft body is copied from
        the current published version, or a blank canonical canvas when
        nothing was published yet; revision starts at 1 and
        baseVersionId links the published base. A canvas that already has
        a live draft returns 409 DRAFT_EXISTS — in-progress work is never
        overwritten. Archived canvases return 409 CANVAS_ARCHIVED. Subject
        policy applies exactly as for reads.
      operationId: createCanvasDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasDraft"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such canvas, or no subject access to its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A draft already exists, or the canvas is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [canvas]
      summary: Save the shared draft (optimistic concurrency)
      description: >
        Conflict-safe draft write (task 2.4): the client asserts the
        `expectedRevision` it read and the `baseVersionId` the draft
        branched from — the save applies only while both still hold, via
        an UPDATE … WHERE revision CAS under the company write lock. A
        stale revision or base returns 409 DRAFT_CONFLICT and writes
        nothing; a canvas with no draft is the uniform 404. The body is
        re-validated draft-mode (400 with issue paths) and
        assignee_user_id references re-checked exactly like on create.
        Audits canvas.draft.save, metadata only.
      operationId: saveCanvasDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasDraftSaveRequest"
      responses:
        "200":
          description: The saved draft — revision bumped by one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasDraft"
        "400":
          description: >
            Strict-envelope or draft-mode validation failure — issue
            paths in details.fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such canvas, no draft to save, or no subject access to
            the canvas owner — the denial is uniform.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            DRAFT_CONFLICT — expectedRevision or baseVersionId is stale;
            or CANVAS_ARCHIVED on an archived canvas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/canvases/{id}/publish:
    post:
      tags: [canvas]
      summary: Publish the live draft as an immutable version
      description: >
        Turns the shared draft into the next immutable canvas_version
        (task 2.4): version_no = max(version_no)+1 taken under the canvas
        row lock, the draft is consumed, canvas.current_version_id points
        at the new snapshot, and the whole thing commits in one
        transaction with its metadata-only audit row. The body must pass
        publish-mode completeness — errors are 400 with issue paths.
        `idempotencyKey` binds the write to a (scope, key) write_receipt:
        a retry with the same key replays the stored versionId/versionNo
        without writing again, and the same key carrying a different
        request is 409. The receipt is consulted AFTER the permission
        check, so a revoked actor can never replay. `expectedRevision` is
        the draft CAS — a stale value is 409 DRAFT_CONFLICT.
      operationId: publishCanvas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasPublishRequest"
      responses:
        "200":
          description: The published version (fresh or replayed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasPublishResponse"
        "400":
          description: >
            Strict-envelope failure or publish-mode completeness errors —
            issue paths in details.fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such canvas, no live draft, or no subject access to the
            canvas owner — the denial is uniform.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            IDEMPOTENCY_CONFLICT (key reused with a different payload),
            DRAFT_CONFLICT (stale expectedRevision or base), or
            CANVAS_ARCHIVED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/canvases/{id}/versions/{versionId}/restore:
    post:
      tags: [canvas]
      summary: Restore a published version into the shared draft
      description: >
        Copies the version's body into the canvas's draft (task 2.4) —
        history is never mutated; restore writes only canvas_draft. With
        no live draft a new one is created (revision 1) based on the
        CURRENT head, content starting at the restored body. With a live
        draft the request must carry its `expectedRevision` AND
        `confirm: true` — restore never silently discards in-progress
        work and answers 409 DRAFT_CONFLICT otherwise. Audits
        canvas.restore, metadata only.
      operationId: restoreCanvasVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasRestoreRequest"
      responses:
        "200":
          description: The draft holding the restored body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasDraft"
        "400":
          description: Strict-envelope validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such canvas/version pair, or no subject access to the
            canvas owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            DRAFT_CONFLICT — a live draft exists and expectedRevision +
            confirm:true were not both supplied; or CANVAS_ARCHIVED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/canvases/{id}/archive:
    post:
      tags: [canvas]
      summary: Archive the canvas (write-off flag, never a delete)
      description: >
        Flips status to archived with archived_at/archived_by (task 2.4,
        spec §9). Reads keep working; every write path — save, publish,
        draft open, restore, transfer — answers 409 CANVAS_ARCHIVED.
        Archiving an already-archived canvas is the same 409. Audits
        canvas.archive, metadata only.
      operationId: archiveCanvas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
      responses:
        "200":
          description: The canvas detail after archiving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Canvas"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such canvas, or no subject access to its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The canvas is already archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/canvases/{id}/unarchive:
    post:
      tags: [canvas]
      summary: Undo archive — the canvas becomes editable again
      description: >
        Flips status back to active and clears archived_at/archived_by
        (they travel with the flag). Gated like archive: active actor,
        canvas in the company, subject access on the owner — denials are
        the uniform 404. The live draft and every published version are
        untouched. Unarchiving an active canvas is 409 CANVAS_NOT_ARCHIVED.
        Audits canvas.unarchive, metadata only; the earlier canvas.archive
        row stays.
      operationId: unarchiveCanvas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
      responses:
        "200":
          description: The canvas detail after unarchiving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Canvas"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such canvas, or no subject access to its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The canvas is not archived (CANVAS_NOT_ARCHIVED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/canvases/{id}/transfer:
    post:
      tags: [canvas]
      summary: Transfer canvas ownership (owner role only)
      description: >
        Reassigns the canvas owner (task 2.4). Restricted by ROLE, not by
        subject scoping: the caller must hold the owner role — member,
        manager and admin are all denied 403 even where subject access
        would pass. The target must be an ACTIVE user of the same
        company — foreign/unknown ids are the uniform 404, an inactive
        one is 409 USER_NOT_ACTIVE. Access follows the new owner
        immediately. Audits canvas.transfer, metadata only.
      operationId: transferCanvasOwner
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasTransferRequest"
      responses:
        "200":
          description: The canvas detail under the new owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Canvas"
        "400":
          description: Strict-envelope validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller does not hold the owner role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such canvas, no such target user, or no subject access to
            the canvas owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The target user is inactive or the canvas is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/canvases/{id}/versions:
    get:
      tags: [canvas]
      summary: List published versions of a canvas (history)
      description: >
        Every published version of the canvas, newest first — summaries
        only (no bodies; each snapshot is fetched through
        GET .../versions/{versionId}). Versions are bounded per canvas —
        publish is a deliberate manual action — so the full ordered list
        is returned without pagination. Subject policy on the canvas
        owner applies to history exactly as to drafts: missing, foreign
        and denied ids all return the same 404.
      operationId: listCanvasVersions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
      responses:
        "200":
          description: The version history, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanvasVersionSummary"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such canvas, or no subject access to its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/canvases/{id}/versions/{versionId}:
    get:
      tags: [canvas]
      summary: Read one published version snapshot
      description: >
        Immutable snapshot read — there is no update or delete route for
        versions (the runtime DB role cannot mutate canvas_version at
        all). Subject access on the canvas owner applies to history the
        same as to drafts (spec §4); a version id paired with another
        canvas's id is a uniform 404.
      operationId: getCanvasVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: The published snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasVersion"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such canvas/version pair, or no subject access to the
            canvas owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/canvases/{id}/versions/{versionId}/export:
    get:
      tags: [canvas]
      summary: Export one published version (JSON or Markdown)
      description: >
        Audited export boundary (task 2.7, spec §5.4): reads the immutable
        published snapshot and returns it either verbatim as the canonical
        JSON body or rendered to Markdown with explicit loss warnings —
        extension fields Markdown cannot carry are named in `warnings`, so
        callers can fall back to the lossless JSON. Same subject policy as
        a version read: denied, foreign, missing and mismatched canvas/
        version pairs all return a uniform 404. Every export is recorded in
        the audit trail as metadata only ({mode, version}) — exported
        content never enters the audit log.
      operationId: exportCanvasVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
        - $ref: "#/components/parameters/VersionId"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, markdown]
            default: json
      responses:
        "200":
          description: The exported snapshot plus loss warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasVersionExport"
        "400":
          description: format is not json|markdown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such canvas/version pair, or no subject access to the
            canvas owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/canvases/{id}/export-preview:
    post:
      tags: [canvas]
      summary: Authorized preview export of the current draft
      description: >
        Audited draft preview (task 2.7, spec §5.4): returns the current
        server-saved draft body + revision plus the Markdown loss warnings
        a downstream render would produce. The browser toolbar (Markdown /
        JSON / XLSX / PDF) builds its artifacts from THIS payload — never
        from unsaved tab state — so exports are subject-policy gated and
        audited ({mode:"preview", version:revision}) exactly like version
        exports. Returns 404 when the canvas has no current draft (e.g.
        publish consumed it and none was reopened).
      operationId: exportCanvasDraftPreview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanvasId"
      responses:
        "200":
          description: The saved draft preview plus loss warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasDraftExport"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such canvas, no current draft, or no subject access to the
            canvas owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/dashboard:
    get:
      tags: [dashboard]
      summary: Policy-scoped rollup of published canvas evidence
      description: >
        The follow-up dashboard (spec §5.3): `people` are exactly the
        subjects the actor may read (self, company for owner/admin,
        reporting subtree for a manager), `canvases` are the canvases
        owned by those subjects joined to their LATEST PUBLISHED version
        only — drafts are never evidence and an unpublished canvas
        reports `status: "unpublished"` with no content. `attention`
        lists only overdue open actions assigned TO the caller
        (`assigneeUserId === actor`), on canvases inside scope; archived
        canvases stay listed as `archived` but their actions stop
        nagging. `series` per canvas is derived from
        `observed[].measurement` of the published snapshot — there is no
        stored or fabricated trend data. "Today" is the company
        calendar day in Asia/Ho_Chi_Minh.
      operationId: getDashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The scoped dashboard rollup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/coaching-sessions:
    get:
      tags: [coaching]
      summary: List the caller's coaching sessions
      description: >
        Lets a session without a report be resumed after a reload. An owner
        sees every session of the company; anyone else sees sessions where
        they are the coach of record, the creator, or the coachee. The
        coachee's view is read-only (relation "coachee": the write gate is
        unchanged and reports keep their own ACL), and a linked canvas is
        shown to them only when they own it (else canvasId is null). Other
        managers, admin and readers of a linked canvas see nothing.
        Metadata only. Ordered newest-created first over
        (created_at, id); limit defaults to 25, max 100; cursor is the
        opaque token from nextCursor.
      operationId: listCoachingSessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from the previous page's nextCursor.
          schema:
            type: string
      responses:
        "200":
          description: One page of visible sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingSessionPage"
        "400":
          description: Invalid limit or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [coaching]
      summary: Record a coaching session
      description: >
        The declared coach is the LOGGED-IN actor and must currently manage
        the coachee (manager role + current reporting subtree) — or be the
        owner, who may coach anyone. An owner may also name a different
        coachUserId to enter a historical session on that coach's behalf;
        the override is audited as `coaching.session.create_on_behalf` and
        the creator flag never grants share rights (spec §6). Naming
        another coach as a non-owner is 403. `coacheeUserId` must be an
        ACTIVE company user different from the coach; `occurredAt` may not
        be in the future. An optional `canvasId` links the session to a
        canvas the actor can read under the subject policy — checked
        independently, since report rights never flow from canvas rights.
        Sessions are records of fact: no update or delete route exists.
      operationId: createCoachingSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachingSessionCreateRequest"
      responses:
        "201":
          description: Session recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingSessionCreateResponse"
        "400":
          description: >
            Malformed body — coach equals coachee, occurredAt in the
            future, or an invalid field type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Non-owner naming a different coachUserId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            The coach is not the coachee's current manager, the coachee
            or named coach does not exist in this company, or the canvas
            is missing/unreadable — the same denial for every case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The coachee is not an active user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/reports:
    get:
      tags: [coaching]
      summary: List coaching reports the caller may read
      description: >
        Scoped by the report ACL (spec §6) — report creator, session
        coach, owner, or holder of an active report_share — and never by
        the reporting tree or canvas access. `coacheeUserId` filters
        inside the visible scope. Ordered newest-first over
        (created_at, id); limit defaults to 25, max 100; cursor is the
        opaque token from nextCursor. List items carry metadata only —
        `body` and `provenance` are served by GET /reports/{id}.
      operationId: listCoachingReports
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from the previous page's nextCursor.
          schema:
            type: string
        - name: coacheeUserId
          in: query
          required: false
          description: Restrict the page to sessions for one coachee.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: One page of visible report list items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingReportPage"
        "400":
          description: Invalid limit, cursor, or coacheeUserId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [coaching]
      summary: Save a validated ORACLE preview as an immutable report
      description: >
        Explicit save (spec §6) — the ONLY way a grader preview becomes a
        report. The request carries ids and an idempotency key, never a
        report body: the server re-reads its own validated in-memory
        preview, re-checks CURRENT write authority (owner, or the session
        coach who still manages the coachee — checked again at save time,
        not just run start), and inserts the next immutable
        `report_version` under the company lock. Provenance is copied onto
        the report row so retention may later delete the `ai_run`
        (FK ON DELETE SET NULL) without losing it. Replaying the same
        idempotencyKey returns the same report; a re-grade under a new key
        appends a new version. Audited as `coaching.report.save` with
        metadata only — body and transcript never enter audit or logs.
      operationId: saveCoachingReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachingReportSaveRequest"
      responses:
        "201":
          description: Report version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingReportSaveResponse"
        "200":
          description: Idempotent replay — same key, same ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingReportSaveResponse"
        "400":
          description: Invalid body shape (unknown/malformed fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Related actor who lost current report-write
            authority (e.g. the coach no longer manages the coachee).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session or run missing, foreign, or owned by
            another user — uniform, no existence disclosure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: AI_RUN_MISMATCH (not this session's oracle run) or
            AI_RUN_NOT_SUCCEEDED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: PREVIEW_EXPIRED — the validated preview is gone
            (TTL or restart); grade again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: ORACLE_REPORT_INVALID — the preview is not a
            validated grader output.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/reports/{id}:
    get:
      tags: [coaching]
      summary: Read one coaching report
      description: >
        The same ACL as the list: creator, session coach, owner, or an
        active share. Missing, foreign-company, and unreadable ids all
        return the same 404. Every authorized read is audited as
        `coaching.report.read` with metadata only — the report body never
        enters audit or logs.
      operationId: getCoachingReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Report id inside the caller's company.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingReport"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Missing, foreign, or not shared with the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [coaching]
      summary: Delete a report (confirmed, body + shares)
      description: >
        Coach of record or owner only — decided AFTER the read ACL, so
        unreadable ids still answer 404 while a readable non-manager gets
        403. The body MUST be `{"confirm": true}` — anything else is 400.
        Removes the report row and cascades its shares; the audit trail
        keeps `coaching.report.delete` with metadata only — deleted
        content never survives in audit.
      operationId: deleteCoachingReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              additionalProperties: false
              properties:
                confirm:
                  type: boolean
                  enum: [true]
      responses:
        "204":
          description: Deleted — body and shares gone.
        "400":
          description: Missing or false confirm flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Readable but not coach-of-record or owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Missing, foreign, or not shared with the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/reports/{id}/shares/{userId}:
    put:
      tags: [coaching]
      summary: Share one report version with a company user
      description: >
        Explicit share grant (spec §6) on THIS report row — a new
        report_version gets a fresh empty share set. Coach of record or
        owner only (read ACL first: unreadable → 404, readable
        non-manager → 403). The target must be an active same-company
        user; sharing a user who already holds ACL access is harmless.
        Re-sharing a revoked grant re-activates it.
      operationId: shareCoachingReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          description: Same-company active user to grant read access.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Share active (fresh or re-activated).
          content:
            application/json:
              schema:
                type: object
                required: [reportId, userId]
                properties:
                  reportId:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Readable but not coach-of-record or owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Report unreadable/missing, or target user unknown
            or inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [coaching]
      summary: Revoke a report share
      description: >
        Same manage gate as the grant. Revocation is effective from the
        next request; revoking a grant that does not exist (or is already
        revoked) is a plain 404.
      operationId: revokeCoachingReportShare
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Share revoked.
        "401":
          description: Missing/expired/revoked session or inactive user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Readable but not coach-of-record or owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Report unreadable/missing, or no active share.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the `gwp_csrf` cookie (double-submit).
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      description: Page size — default 25, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Keyset cursor — the id of the last item of the previous page.
      schema:
        type: string
        format: uuid
    OrgUnitId:
      name: id
      in: path
      required: true
      description: Org unit id inside the caller's company.
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      description: User id inside the caller's company.
      schema:
        type: string
        format: uuid
    DepartmentIdFilter:
      name: departmentId
      in: query
      required: false
      description: Restrict the team list to one department.
      schema:
        type: string
        format: uuid
    CanvasId:
      name: id
      in: path
      required: true
      description: Canvas id inside the caller's company.
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      description: Published version id of the canvas.
      schema:
        type: string
        format: uuid
  responses:
    RateLimited:
      description: Rate limit exceeded — see Retry-After header.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable machine code (e.g. INVALID_SESSION).
        message:
          type: string
          description: Human-readable, Vietnamese UI copy.
        details:
          description: Optional structured detail (field names, pending list).
        request_id:
          type: string
          format: uuid
          description: Echo of the X-Request-Id response header.
    PublicUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        title:
          type: string
          nullable: true
    SetupRequest:
      type: object
      required: [companyName, email, password, bootstrapToken]
      properties:
        companyName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          description: Owner password — 12+ chars, Argon2id-hashed at rest.
        bootstrapToken:
          type: string
          description: Operator-provided BOOTSTRAP_TOKEN value.
    SetupResponse:
      type: object
      required: [userId, companyId]
      properties:
        userId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: HS256 JWT — iss=gwp, aud=gwp-web, ~10 min TTL.
        user:
          $ref: "#/components/schemas/PublicUser"
    RefreshResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
    MeResponse:
      type: object
      required: [user, roles]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        roles:
          type: array
          items:
            type: string
            enum: [owner, admin, manager, member]
    CompanyProfile:
      type: object
      required: [id, name, timezone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          description: IANA timezone identifier (e.g. Asia/Ho_Chi_Minh).
        createdAt:
          type: string
          format: date-time
    CompanyPatchRequest:
      type: object
      description: >
        At least one field required. Strict — unknown keys are rejected.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          description: Valid IANA timezone identifier.
          maxLength: 100
    Department:
      type: object
      required: [id, name, archivedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Non-null when the unit is archived; never deleted.
    DepartmentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Department"
        nextCursor:
          type: string
          nullable: true
          description: Pass as ?cursor= for the next page; null at the end.
    DepartmentCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    DepartmentUpdateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    Team:
      type: object
      required: [id, departmentId, name, archivedAt]
      properties:
        id:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        name:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
    TeamPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        nextCursor:
          type: string
          nullable: true
    TeamCreateRequest:
      type: object
      required: [departmentId, name]
      additionalProperties: false
      properties:
        departmentId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
    TeamUpdateRequest:
      type: object
      description: >
        At least one field required. Strict — unknown keys are rejected.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        departmentId:
          type: string
          format: uuid
    ManagerUpdateRequest:
      type: object
      required: [managerId]
      additionalProperties: false
      description: >
        The managerId key is required; its value is a user uuid of the
        same company, or explicit null to unassign the subject's manager.
      properties:
        managerId:
          type: string
          format: uuid
          nullable: true
    UserManager:
      type: object
      required: [id, managerId]
      properties:
        id:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
          nullable: true
          description: The subject's manager after the write.
    User:
      type: object
      description: >
        Directory entry — safe for any authenticated member. Credential
        material (password_hash, tokens) is never present.
      required:
        [
          id,
          email,
          name,
          title,
          departmentId,
          teamId,
          managerId,
          status,
          roles,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        title:
          type: string
          nullable: true
        departmentId:
          type: string
          format: uuid
          nullable: true
        teamId:
          type: string
          format: uuid
          nullable: true
        managerId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, active, inactive]
        roles:
          type: array
          items:
            type: string
            enum: [owner, admin, manager, member]
          description: The user's current full role set, sorted.
        createdAt:
          type: string
          format: date-time
    UserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          type: string
          nullable: true
          description: Pass as ?cursor= for the next page; null at the end.
    UserCreateRequest:
      type: object
      required: [email, name]
      additionalProperties: false
      description: >
        Creates a pending member only — no password, roles, manager or
        status keys are accepted. teamId pins the department to the team's
        own; departmentId alone is allowed.
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Unique per company after lower/trim normalization.
        name:
          type: string
          minLength: 1
          maxLength: 200
        title:
          type: string
          minLength: 1
          maxLength: 200
        departmentId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
    UserUpdateRequest:
      type: object
      additionalProperties: false
      description: >
        At least one field required. Strict — privilege and identity keys
        (role/roles, managerId, email, password, status) are rejected.
        Explicit null clears title, departmentId or teamId; setting a
        teamId pins departmentId to the team's department.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        title:
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
        departmentId:
          type: string
          format: uuid
          nullable: true
        teamId:
          type: string
          format: uuid
          nullable: true
    RolesUpdateRequest:
      type: object
      required: [roles]
      additionalProperties: false
      description: >
        The full replacement role set — union semantics over the
        allowlist; an empty array removes every role.
      properties:
        roles:
          type: array
          maxItems: 4
          items:
            type: string
            enum: [owner, admin, manager, member]
    UserDeactivateRequest:
      type: object
      additionalProperties: false
      description: >
        Empty body is legal. When the target still has direct reports of
        any status the key is required: a uuid transfers the reports,
        explicit null unassigns them, absent → 403 REPORTS_UNASSIGNED.
      properties:
        replacementManagerId:
          type: string
          format: uuid
          nullable: true
    UserReactivateRequest:
      type: object
      additionalProperties: false
      description: >
        Empty body (or no body). There are no writable fields — the
        resulting status (active/pending) is the server's decision.
      properties: {}
    CredentialTokenIssueRequest:
      type: object
      required: [purpose]
      additionalProperties: false
      description: >
        "activate" is issuable only for pending users, "reset" only for
        active ones — the wrong pairing is a 409.
      properties:
        purpose:
          type: string
          enum: [activate, reset]
    CredentialTokenIssueResponse:
      type: object
      required: [token, expiresAt]
      description: >
        The raw token appears ONLY here, once — the DB stores its SHA-256
        hash and no read-back endpoint exists.
      properties:
        token:
          type: string
          description: 256-bit opaque token, base64url — hand to the user over an internal channel.
        expiresAt:
          type: string
          format: date-time
          description: Issuance + 24h.
    CredentialConsumeRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The one-time token as issued.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 256
    Branding:
      type: object
      required: [displayName, accentColor]
      additionalProperties: false
      description: >
        The whole writable branding surface — plain-text display name and
        a #rrggbb accent color. No HTML, URL or free-CSS field exists.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          description: Plain text; clients must render via textContent.
        accentColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Hex color applied as a CSS custom-property value.
    Retention:
      type: object
      required: [auditDays, aiRunDays, logDays, receiptDays]
      additionalProperties: false
      description: >
        Retention floors in days (spec §9) — each value can only RAISE
        the shipped minimum; the retention job enforces the effective
        floor as max(default, configured).
      properties:
        auditDays:
          type: integer
          minimum: 365
        aiRunDays:
          type: integer
          minimum: 90
        logDays:
          type: integer
          minimum: 30
        receiptDays:
          type: integer
          minimum: 7
    AiStatus:
      type: object
      required: [configured, enabled]
      additionalProperties: false
      properties:
        configured:
          type: boolean
          description: An endpoint key is stored for this company.
        enabled:
          type: boolean
          description: Configured AND switched on — runs can start.
    AiSettings:
      type: object
      required:
        [
          configured,
          enabled,
          baseUrl,
          model,
          timeoutSeconds,
          maxOutputTokens,
          keyVersion,
          updatedAt,
        ]
      additionalProperties: false
      description: >
        Public AI settings shape — safe metadata only. The stored API key
        and its AES-256-GCM envelope are never serialized: `configured`
        is the only signal the credential exists.
      properties:
        configured:
          type: boolean
          description: Whether an API key is stored (server-side).
        enabled:
          type: boolean
        baseUrl:
          type: string
          nullable: true
          description: Allowlisted AI endpoint base URL.
        model:
          type: string
          nullable: true
        timeoutSeconds:
          type: integer
          minimum: 5
          maximum: 180
        maxOutputTokens:
          type: integer
          minimum: 1
          maximum: 8192
        keyVersion:
          type: string
          nullable: true
          description: APP_KEY ring version that sealed the stored key.
        updatedAt:
          type: string
          nullable: true
          format: date-time
    AiSettingsPut:
      type: object
      required: [enabled, baseUrl, model]
      additionalProperties: false
      description: >
        Writable AI settings. `apiKey` is optional — omitting it
        preserves the stored key; clearing is the separate DELETE
        /settings/ai/key command. `null` is rejected for every field.
      properties:
        enabled:
          type: boolean
        baseUrl:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            Must be an allowlisted AI_ALLOWED_HOSTS host:port — no
            userinfo, no query/fragment; http:// needs AI_ALLOW_HTTP.
        model:
          type: string
          minLength: 1
          maxLength: 200
        apiKey:
          type: string
          minLength: 1
          maxLength: 512
          description: Write-only; encrypted at rest, never returned.
        timeoutSeconds:
          type: integer
          minimum: 5
          maximum: 180
          default: 180
        maxOutputTokens:
          type: integer
          minimum: 1
          maximum: 8192
          default: 8192
    AiTestResult:
      type: object
      required: [ok, streaming, model, latencyMs]
      additionalProperties: false
      description: >
        Result of the synthetic connection probe — never carries the
        prompt, the response text, or any credential.
      properties:
        ok:
          type: boolean
          enum: [true]
        streaming:
          type: boolean
          description: Whether the endpoint answered with an SSE stream.
        model:
          type: string
        latencyMs:
          type: integer
          minimum: 0
    AiRunStart:
      type: object
      required: [assistant, idempotencyKey]
      additionalProperties: false
      description: >
        Run admission. `consent` must be true (absent/false →
        AI_CONSENT_REQUIRED). `notes` is optional free text for the run —
        hashed into input_hash, never persisted. Canvas assistants
        (renderer, coach) require `canvasId` and reject `sessionId` /
        `transcript`; `oracle` requires `sessionId` + `transcript` and
        rejects `canvasId` — mixing the two families is INVALID_INPUT.
      properties:
        assistant:
          type: string
          enum: [renderer, coach, oracle]
        canvasId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
          description: Coaching session — required for oracle, forbidden
            for canvas assistants.
        transcript:
          type: string
          minLength: 1
          maxLength: 500000
          description: >
            Raw coaching transcript — required for oracle, forbidden for
            canvas assistants. Hashed into input_hash and passed to the
            driver in-memory only; NEVER persisted.
        reportId:
          type: string
          format: uuid
          description: >
            Report→Renderer bridge (renderer only): a coaching report the
            caller may read. Admission requires BOTH report-read ACL and
            write access on canvasId — either failure is the uniform 404.
            The server extracts only the whitelist fields into the prompt;
            report content can never be pushed by the client.
        reportFields:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            enum: [priorities, followUp, nextSession]
          description: >
            Whitelisted report sections to feed the renderer (defaults to
            all three when reportId is set). Scores, evidence labels,
            quoted spans and transcript text can never be selected.
        notes:
          type: string
          maxLength: 20000
        consent:
          type: boolean
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 200
    AiRunStartResult:
      type: object
      required: [runId, status, replayed]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AiRunStatus"
        replayed:
          type: boolean
          description: true when this POST replayed an existing run.
    AiRunStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, interrupted]
    AiRun:
      type: object
      required:
        [runId, assistant, canvasId, sessionId, status, createdAt,
         startedAt, finishedAt, errorCode, usage]
      additionalProperties: false
      description: Run metadata — never raw input, output, or content.
      properties:
        runId:
          type: string
          format: uuid
        assistant:
          type: string
          enum: [renderer, coach, oracle]
        canvasId:
          type: string
          format: uuid
          nullable: true
          description: Set on canvas-assistant runs; null for oracle.
        sessionId:
          type: string
          format: uuid
          nullable: true
          description: Set on oracle runs; null for canvas assistants.
        status:
          $ref: "#/components/schemas/AiRunStatus"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        errorCode:
          type: string
          nullable: true
        usage:
          type: object
          nullable: true
          description: Present only when the endpoint reported usage —
            never fabricated.
          required: [inputTokens, outputTokens]
          additionalProperties: false
          properties:
            inputTokens:
              type: integer
            outputTokens:
              type: integer
    AiRunPreview:
      type: object
      required: [runId, base, value]
      additionalProperties: false
      description: >
        The staged proposal (in-memory, 15-minute TTL) plus the canvas
        base captured at admission — apply compares against `base`.
      properties:
        runId:
          type: string
          format: uuid
        base:
          type: object
          required: [baseVersionId, draftRevision]
          additionalProperties: false
          properties:
            baseVersionId:
              type: string
              format: uuid
              nullable: true
            draftRevision:
              type: integer
              nullable: true
        value:
          description: The assistant-specific validated proposal payload.
    AiRunApplyRequest:
      type: object
      required: [expectedRevision]
      additionalProperties: false
      description: >
        Apply carries NO canvas body — the server applies its own held
        preview. `expectedRevision` is the draft revision the caller last
        saw (null when there was no draft at run start); the stronger
        guarantee is the captured-base check, which refuses any draft
        that moved since the run began.
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          nullable: true
        acceptedWarnings:
          type: array
          description: >
            Issue ids from the preview the caller explicitly accepts —
            every warning-severity issue must appear here.
          maxItems: 200
          items:
            type: string
            maxLength: 64
    AuditEvent:
      type: object
      description: >
        Metadata-only audit row — never a raw record, never content.
        metadata carries only allowlisted keys with scalar values.
      required:
        [
          id,
          at,
          actorId,
          action,
          outcome,
          requestId,
          targetType,
          targetId,
          metadata,
        ]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        outcome:
          type: string
        requestId:
          type: string
          nullable: true
        targetType:
          type: string
          nullable: true
        targetId:
          type: string
          format: uuid
          nullable: true
        metadata:
          type: object
          description: Only allowlisted keys with scalar values survive.
          additionalProperties:
            nullable: true
            anyOf:
              - type: string
              - type: number
              - type: boolean
    AuditEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: string
          nullable: true
          description: Pass as ?cursor= for the next page; null at the end.
    CanvasBody:
      type: object
      description: >
        The canonical canvas document (schema_version 1) — meta, goal, kr,
        outputs (≤3), solution, behaviors (≤5), the six fixed boxes,
        actions, risks, plan, observed, reviews. The full strict contract
        is docs/contracts/canvas-payload.md; the server validates it
        draft-mode on every write and rejects privilege/server fields
        carried inside it.
    CanvasCreateRequest:
      type: object
      required: [ownerUserId, name, body]
      additionalProperties: false
      properties:
        ownerUserId:
          type: string
          format: uuid
          description: >
            The subject the canvas belongs to — must be an active user of
            the caller's company and inside the caller's subject scope.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name; stamped into body.meta.title.
        body:
          $ref: "#/components/schemas/CanvasBody"
    CanvasCreateResponse:
      type: object
      required: [id, draft]
      properties:
        id:
          type: string
          format: uuid
        draft:
          type: object
          required: [id, revision]
          properties:
            id:
              type: string
              format: uuid
            revision:
              type: integer
    CanvasDraftSaveRequest:
      type: object
      required: [expectedRevision, baseVersionId, body]
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: The draft revision the client read — CAS guard.
        baseVersionId:
          type: string
          format: uuid
          nullable: true
          description: >
            The published version the draft branched from; null before
            the first publish. A stale base is 409 DRAFT_CONFLICT.
        body:
          $ref: "#/components/schemas/CanvasBody"
    CanvasPublishRequest:
      type: object
      required: [expectedRevision, idempotencyKey]
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: The draft revision being published — CAS guard.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            Client-supplied idempotency key bound to a (scope, key)
            write_receipt — same key + same payload replays the stored
            result; same key + different payload is 409.
        changeSummary:
          type: string
          minLength: 1
          maxLength: 500
          description: Optional human note stored on the version row.
    CanvasPublishResponse:
      type: object
      required: [versionId, versionNo]
      properties:
        versionId:
          type: string
          format: uuid
        versionNo:
          type: integer
          description: Monotonic per canvas — never reused, never reordered.
    CanvasRestoreRequest:
      type: object
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: >
            Required when a live draft exists — must equal its current
            revision.
        confirm:
          type: boolean
          description: >
            Required true when a live draft exists — explicit overwrite
            consent; restore never discards a draft silently.
    CanvasRenameRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: New display name — trimmed; blank is rejected.
    CanvasTransferRequest:
      type: object
      required: [newOwnerId]
      additionalProperties: false
      properties:
        newOwnerId:
          type: string
          format: uuid
          description: An ACTIVE user of the same company.
    CanvasDraft:
      type: object
      required:
        [
          id,
          canvasId,
          baseVersionId,
          revision,
          schemaVersion,
          source,
          body,
          createdBy,
          createdAt,
          updatedBy,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        canvasId:
          type: string
          format: uuid
        baseVersionId:
          type: string
          format: uuid
          nullable: true
          description: The published version this draft branched from; null before the first publish.
        revision:
          type: integer
          description: Optimistic-concurrency counter — starts at 1, bumped per save.
        schemaVersion:
          type: integer
          description: Payload version of body (1 today).
        source:
          type: string
          enum: [manual, import, ai]
        body:
          $ref: "#/components/schemas/CanvasBody"
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
    CanvasVersionExport:
      type: object
      required: [schema_version, warnings]
      properties:
        schema_version:
          type: integer
          description: Canonical payload version of `body` (1 today).
        body:
          $ref: "#/components/schemas/CanvasBody"
          description: Present when format=json — the immutable published body, byte-faithful.
        markdown:
          type: string
          description: Present when format=markdown — the rendered Markdown document.
        warnings:
          type: array
          items:
            type: string
          description: >
            Format-loss warnings — e.g. extension fields Markdown cannot
            carry. Empty for JSON (lossless). Codes come from the shared
            Markdown renderer (JSON_REQUIRED_FOR_EXTENSIONS, …).
    CanvasDraftExport:
      type: object
      required: [schema_version, body, revision, markdown, warnings]
      properties:
        schema_version:
          type: integer
          description: Canonical payload version of `body` (1 today).
        body:
          $ref: "#/components/schemas/CanvasBody"
          description: The current server-saved draft body.
        revision:
          type: integer
          description: Draft revision at preview time — changes under CAS on every save.
        markdown:
          type: string
          description: >
            The shared-renderer Markdown of this draft — the artifact the
            `warnings` describe. Clients download/copy THIS text verbatim;
            rendering their own could silently lose different fields.
        warnings:
          type: array
          items:
            type: string
          description: Same loss-warning contract as CanvasVersionExport.
    CanvasVersionSummary:
      type: object
      required:
        [
          id,
          versionNo,
          schemaVersion,
          changeSummary,
          publishedBy,
          publishedByName,
          publishedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        versionNo:
          type: integer
          description: Monotonic per canvas — never reused, never reordered.
        schemaVersion:
          type: integer
        changeSummary:
          type: string
          nullable: true
        publishedBy:
          type: string
          format: uuid
        publishedByName:
          type: string
          description: Display name of the publisher — "" when unknown.
        publishedAt:
          type: string
          format: date-time
    CanvasVersion:
      allOf:
        - $ref: "#/components/schemas/CanvasVersionSummary"
        - type: object
          required: [canvasId, body, provenance]
          properties:
            canvasId:
              type: string
              format: uuid
            body:
              $ref: "#/components/schemas/CanvasBody"
            provenance:
              type: object
              nullable: true
              description: AI/import provenance when the version came from a tool run.
    Canvas:
      type: object
      required:
        [
          id,
          ownerUserId,
          ownerName,
          name,
          status,
          currentVersionId,
          createdAt,
          archivedAt,
          archivedBy,
          draft,
          currentVersion,
        ]
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        ownerName:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        currentVersionId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
        archivedBy:
          type: string
          format: uuid
          nullable: true
        draft:
          # OpenAPI 3.0.3: `nullable` is ignored as a $ref sibling — wrap
          # the ref in allOf so the nullable actually takes effect.
          allOf:
            - $ref: "#/components/schemas/CanvasDraft"
          nullable: true
        currentVersion:
          allOf:
            - $ref: "#/components/schemas/CanvasVersionSummary"
          nullable: true
    CanvasListItem:
      type: object
      required:
        [
          id,
          ownerUserId,
          ownerName,
          name,
          status,
          hasDraft,
          currentVersionId,
          createdAt,
          archivedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        ownerName:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        hasDraft:
          type: boolean
        currentVersionId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
    CanvasPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CanvasListItem"
        nextCursor:
          type: string
          nullable: true
          description: Pass as ?cursor= for the next page; null at the end.
    SeriesPoint:
      type: object
      required: [observedId, date, value, layer]
      properties:
        observedId:
          type: string
          description: The observed row this point was derived from — evidence citation.
        date:
          type: string
          format: date
          description: ISO date verbatim from measurement.date — never re-zoned.
        value:
          type: number
        layer:
          type: string
          enum: [BEHAVIOR, OUTPUT, RESULT]
    MeasurementSeries:
      type: object
      required:
        [
          key,
          metricId,
          definitionRevision,
          unit,
          baseline,
          target,
          points,
          latest,
          progressPct,
        ]
      properties:
        key:
          type: string
          description: Series identity — [metricId, definitionRevision, unit].
        metricId:
          type: string
        definitionRevision:
          type: integer
        unit:
          type: string
        baseline:
          type: number
        target:
          type: number
        points:
          type: array
          items:
            $ref: "#/components/schemas/SeriesPoint"
        latest:
          type: number
          nullable: true
        progressPct:
          type: number
          nullable: true
          description: Null when baseline === target (a "maintain" metric).
    DashboardPerson:
      type: object
      required:
        [userId, name, title, managerId, canvasCount, publishedCount, overdueActions]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        title:
          type: string
        managerId:
          type: string
          format: uuid
          nullable: true
        canvasCount:
          type: integer
        publishedCount:
          type: integer
        overdueActions:
          type: integer
          description: Overdue open actions assigned to this person on readable canvases.
    AttentionItem:
      type: object
      required:
        [
          actionId,
          canvasId,
          canvasName,
          action,
          deadline,
          status,
          assigneeUserId,
          assigneeLabel,
          daysOverdue,
        ]
      properties:
        actionId:
          type: string
        canvasId:
          type: string
          format: uuid
        canvasName:
          type: string
        action:
          type: string
        deadline:
          type: string
          format: date
        status:
          type: string
        assigneeUserId:
          type: string
          format: uuid
        assigneeLabel:
          type: string
          description: Display label only — identity is assigneeUserId.
        daysOverdue:
          type: integer
    DashboardCanvas:
      type: object
      required:
        [
          id,
          name,
          ownerUserId,
          ownerName,
          status,
          stage,
          currentVersionNo,
          publishedAt,
          openActions,
          overdueActions,
          series,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerUserId:
          type: string
          format: uuid
        ownerName:
          type: string
        status:
          type: string
          enum: [unpublished, published, archived]
        stage:
          type: string
          nullable: true
        currentVersionNo:
          type: integer
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        openActions:
          type: integer
        overdueActions:
          type: integer
        series:
          type: array
          items:
            $ref: "#/components/schemas/MeasurementSeries"
    Dashboard:
      type: object
      required: [generatedAt, people, attention, canvases]
      properties:
        generatedAt:
          type: string
          format: date-time
        people:
          type: array
          items:
            $ref: "#/components/schemas/DashboardPerson"
        attention:
          type: array
          items:
            $ref: "#/components/schemas/AttentionItem"
        canvases:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCanvas"
    CoachingSessionCreateRequest:
      type: object
      required: [coachUserId, coacheeUserId, occurredAt]
      additionalProperties: false
      properties:
        coachUserId:
          type: string
          format: uuid
          description: >
            The logged-in actor — a different value is a historical entry
            on that coach's behalf, which only an owner may record.
        coacheeUserId:
          type: string
          format: uuid
          description: Active company user inside the coach's current subtree.
        canvasId:
          type: string
          format: uuid
          description: Optional canvas link — must be readable by the actor.
        occurredAt:
          type: string
          format: date-time
          description: When the session happened — not in the future.
    CoachingSessionCreateResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    CoachingSessionListItem:
      type: object
      required:
        [id, coachUserId, coacheeUserId, canvasId, occurredAt, createdBy, createdAt, relation]
      properties:
        id:
          type: string
          format: uuid
        coachUserId:
          type: string
          format: uuid
        coacheeUserId:
          type: string
          format: uuid
        canvasId:
          type: string
          format: uuid
          nullable: true
        occurredAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        relation:
          type: string
          enum: [coach, creator, owner, coachee]
          description: >
            Why the caller sees this session (precedence coach > creator >
            owner > coachee). Only "coachee" is a read-only view.
    CoachingSessionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CoachingSessionListItem"
        nextCursor:
          type: string
          nullable: true
          description: Pass as ?cursor= for the next page; null at the end.
    CoachingReportListItem:
      type: object
      required:
        - id
        - sessionId
        - coachUserId
        - coacheeUserId
        - canvasId
        - reportVersion
        - rubricVersion
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        coachUserId:
          type: string
          format: uuid
        coacheeUserId:
          type: string
          format: uuid
        canvasId:
          type: string
          format: uuid
          nullable: true
        reportVersion:
          type: integer
        rubricVersion:
          type: string
          nullable: true
          description: e.g. ORACLE-v3 — null until a grader run fills it.
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    CoachingReportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CoachingReportListItem"
        nextCursor:
          type: string
          nullable: true
          description: Pass as ?cursor= for the next page; null at the end.
    CoachingReport:
      allOf:
        - $ref: "#/components/schemas/CoachingReportListItem"
        - type: object
          required: [occurredAt, aiRunId, body, provenance]
          properties:
            occurredAt:
              type: string
              format: date-time
            aiRunId:
              type: string
              format: uuid
              nullable: true
              description: The grader run that produced the body, if any.
            body:
              type: object
              description: >
                The validated grader report document — never the raw
                transcript, which is never stored.
            provenance:
              type: object
              description: Grader provenance metadata (model, rubric, timing).
    CoachingReportSaveRequest:
      type: object
      required: [sessionId, runId, idempotencyKey]
      additionalProperties: false
      description: >
        Explicit save — ids only, never a report body. The body is read
        from the server's own validated preview; a client-supplied report
        is not accepted.
      properties:
        sessionId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
          description: The caller's own succeeded oracle run on sessionId.
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 200
          description: Same key + same ids replay the original report.
    CoachingReportSaveResponse:
      type: object
      required: [reportId, reportVersion]
      additionalProperties: false
      properties:
        reportId:
          type: string
          format: uuid
        reportVersion:
          type: integer
          description: Immutable per-session version, assigned under the
            company lock.
