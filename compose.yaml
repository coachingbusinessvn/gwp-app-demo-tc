# GWP deployment bundle (task 0.6, spec §9) — production-shaped and also the
# supported local-run path.
#
#   docker compose up -d --build
#
# Secrets/config come from a gitignored `.env` (see .env.example and
# docs/operations/foundation.md). Compose interpolates `.env` values into the
# per-service `environment:` allowlists below — there is deliberately NO
# `env_file`, so each container sees only the credentials it needs. The
# long-running `app` in particular never carries the Postgres superuser,
# migrator, or maintenance credentials (the config.ts invariant).
#
# `${VAR}` without a default renders as an empty string when unset (compose
# prints a warning); every consumer then fails fast with a clear error —
# loadConfig ("missing required env"), the postgres entrypoint
# (POSTGRES_PASSWORD required), or the migrator (NODE_ENV=production requires
# MIGRATOR_DATABASE_URL). Optional vars carry explicit defaults (`:-value`)
# or pass through silently (`:-` — empty falls back to the code default), so
# compose warnings are reserved for vars that genuinely must be set.
#
# The database is reachable ONLY on the compose-internal network — it
# intentionally has no published port.
#
# Boot order: db (healthy) → db-bootstrap (least-privilege roles) →
# migrate (one-shot `npm run db:migrate` equivalent) → app.

name: gwp

services:
  db:
    image: postgres:18-alpine
    # Postgres init vars only — the DB container never sees app secrets.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gwp}
      POSTGRES_USER: ${POSTGRES_USER:-gwp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Mount the parent dir: postgres:18 stores data under a
      # versioned PGDATA subdirectory.
      - db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER:-gwp}\" -d \"$${POSTGRES_DB:-gwp}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    # Operational logs are bounded on-disk (spec §9: 30-day ops-log
    # window) — the local driver rotates by size and logs die with the
    # container; see docs/operations/security-retention.md.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # Deliberately NO `ports:` — the database must never be reachable from
    # outside the compose network (spec §9). Verified by the deployment test.

  db-bootstrap:
    image: gwp-app:local
    depends_on:
      db:
        condition: service_healthy
    # One-shot: creates gwp_migrator / gwp_runtime / gwp_maintenance and the
    # least-privilege grants. The ONLY service that may hold the superuser
    # connection (BOOTSTRAP_ADMIN_URL) plus the per-role passwords it sets.
    # The image's baked-in NODE_ENV=production makes the script refuse to set
    # role passwords — GWP_SET_ROLE_PASSWORDS is the explicit opt-in that
    # applies the GWP_*_PASSWORD values (.env is this bundle's secret store).
    environment:
      BOOTSTRAP_ADMIN_URL: ${BOOTSTRAP_ADMIN_URL}
      BOOTSTRAP_SCHEMA: ${BOOTSTRAP_SCHEMA:-public}
      GWP_MIGRATOR_PASSWORD: ${GWP_MIGRATOR_PASSWORD}
      GWP_RUNTIME_PASSWORD: ${GWP_RUNTIME_PASSWORD}
      GWP_MAINTENANCE_PASSWORD: ${GWP_MAINTENANCE_PASSWORD}
      GWP_SET_ROLE_PASSWORDS: "true"
    command: ["node", "dist/scripts/ops/bootstrap-db-roles.js"]
    restart: "no"

  migrate:
    image: gwp-app:local
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    # One-shot migrator — the compiled equivalent of `npm run db:migrate`
    # (the npm script uses tsx, a devDependency not shipped in the image).
    # NODE_ENV=production makes MIGRATOR_DATABASE_URL mandatory, so the app
    # credential can never accidentally gain DDL rights. DEMO_MODE is passed
    # through because the migrator stamps it into deployment_state.
    environment:
      NODE_ENV: production
      MIGRATOR_DATABASE_URL: ${MIGRATOR_DATABASE_URL}
      DEMO_MODE: ${DEMO_MODE:-production}
    command: ["node", "dist/server/src/db/migrate.js"]
    restart: "no"

  app:
    # Air-gap install (task 4.6): when gwp-app:local was loaded from the
    # bundle's images/*.tar, `docker compose up` uses it as-is — compose
    # only builds when the named image is absent. The build block stays so
    # a source checkout keeps working; nothing is ever pulled at runtime.
    build:
      context: .
    image: gwp-app:local
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Runtime allowlist ONLY — exactly what server/src/config.ts reads. The
    # app must never see the superuser URL, the DDL migrator credential, the
    # maintenance/backup credential, or the role passwords: an app-level RCE
    # must not become a full database takeover.
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_KEY: ${APP_KEY}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      DEMO_MODE: ${DEMO_MODE:-production}
      APP_ORIGIN: ${APP_ORIGIN}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-}
    # Published on ALL interfaces — LAN access is an explicit requirement.
    # Terminate TLS at a reverse proxy in front for any real deployment
    # (docs/operations/foundation.md). Override the host side with APP_PORT.
    ports:
      - "${APP_PORT:-8080}:8080"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Retention job (task 4.5, spec §9): one-shot container the operator
  # runs on a schedule — e.g. a daily cron `docker compose run --rm
  # retention`. It connects as gwp_maintenance (SELECT + scoped DELETE on
  # the retention-managed tables only) — never the runtime or superuser
  # credential, and the app service never sees this URL.
  retention:
    image: gwp-app:local
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MAINTENANCE_DATABASE_URL: ${MAINTENANCE_DATABASE_URL}
    command: ["node", "dist/server/src/jobs/retention.js"]
    restart: "no"

volumes:
  db-data:
