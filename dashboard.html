<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng theo dõi — Performance Follow-up | GoWise Partners</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/gwp.css">
</head>
<body data-page="dashboard">
<main>
  <div class="eyebrow" id="eyebrow">Performance Follow-up</div>
  <h1 class="title" id="ptitle">Bảng theo dõi</h1>
  <p class="note" id="psub"></p>

  <section class="card" id="attention"></section>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-team" aria-controls="panel-team" aria-selected="true">Đội ngũ của tôi</button>
    <button role="tab" id="tab-mine" aria-controls="panel-mine" aria-selected="false">Canvas cá nhân</button>
  </div>

  <section class="tabpanel" id="panel-team" role="tabpanel" aria-labelledby="tab-team">
    <div class="card">
      <h2 class="title">Sơ đồ đội ngũ</h2>
      <p class="note" style="margin-bottom:14px">Bấm vào một người để xem các bản canvas theo tuần của họ. Chấm màu cho biết tình trạng theo dõi tại hôm nay.</p>
      <ul class="tree" id="tree"></ul>
    </div>
  </section>

  <section class="tabpanel" id="panel-mine" role="tabpanel" aria-labelledby="tab-mine" hidden>
    <div class="card" id="mine"></div>
  </section>
</main>

<script type="module" src="assets/app.js"></script>
</body>
</html>
